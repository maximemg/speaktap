[project]
name = "speaktap"
version = "0.1.0"
description = "Fast, private, local dictation for Linux"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [{ name = "Maxime MG" }]
keywords = ["asr", "dictation", "linux", "onnx", "speech-to-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=2.3,<3",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "onnxruntime>=1.27,<2",
]

[project.scripts]
speaktap = "speaktap.client:main"
speaktap-service = "speaktap.service_app:main"
speaktap-transcribe-file = "speaktap.file_cli:main"
speaktap-benchmark = "speaktap.benchmark.benchmark:main"
speaktap-model-benchmark = "speaktap.benchmark.suite:main"
speaktap-models = "speaktap.model_cli:main"

[project.urls]
Homepage = "https://github.com/maximemg/speaktap"
Repository = "https://github.com/maximemg/speaktap.git"
Issues = "https://github.com/maximemg/speaktap/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speaktap"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
