---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy speaktap tests
      - run: uv run pytest
      - run: uv build
      - run: shellcheck install.sh toggle.sh
